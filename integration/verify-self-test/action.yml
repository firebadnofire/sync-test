name: Verify gh-sync self-test release
description: Verify the fixed firebadnofire/sync-test integration release
inputs:
  token:
    description: GitHub token used to read the integration release
    required: true
  is_fine:
    description: Whether token is fine-grained (true) or classic (false)
    required: false
    default: "false"
runs:
  using: docker
  image: Dockerfile
